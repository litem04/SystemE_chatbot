services:
  db:
    image: postgres:16
    container_name: techgear_postgres_container
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=techgear_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - techgear-network

  vector-db:
    image: pgvector/pgvector:pg16
    container_name: postgres_pgvector
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chatbot_rag
    ports:
      - "5433:5432"
    volumes:
      - vector_db_data:/var/lib/postgresql/data
    networks:
      - techgear-network

  app:
    build: .
    container_name: my_springboot_app
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - db
      - vector-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/techgear_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - VECTOR_DB_HOST=vector-db
      - VECTOR_DB_PORT=5432
      - VECTOR_DB_USER=postgres
      - VECTOR_DB_PASSWORD=postgres
      - VECTOR_DB_NAME=chatbot_rag
    volumes:
      - ./product-images:/app/product-images
    networks:
      - techgear-network

  adminer:
    image: adminer:latest
    container_name: techgear_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - techgear-network

volumes:
  db_data:
  vector_db_data:

networks:
  techgear-network:
    driver: bridge
