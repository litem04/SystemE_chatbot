<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt hàng thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .success-card { max-width: 600px; margin: 60px auto; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .success-icon { font-size: 80px; color: #198754; }
    </style>
</head>
<body>
    <div class="container my-auto">
        <div class="card success-card p-5 text-center bg-white">
            <div class="mb-4">
                <i class="fas fa-check-circle success-icon text-success"></i>
            </div>
            <h2 class="text-success fw-bold">Đặt hàng thành công!</h2>
            <p class="lead text-muted">Cảm ơn bạn đã tin tưởng mua sắm tại TechGear Store.</p>
            <p class="text-secondary">Đơn hàng của bạn đã được tiếp nhận và nhân viên sẽ liên hệ đóng gói, giao hàng trong thời gian sớm nhất.</p>
            <div class="mt-4 d-flex justify-content-center gap-2">
                <a href="/my-orders" class="btn btn-outline-primary px-4"><i class="fas fa-box-open me-1"></i> Xem đơn hàng của tôi</a>
                <a href="/" class="btn btn-primary px-4"><i class="fas fa-store me-1"></i> Tiếp tục mua sắm</a>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer_fragment}"></div>
</body>
</html>
