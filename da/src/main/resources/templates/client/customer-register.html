<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .form-label {
            margin-bottom: 0.35rem;
        }
        .password-toggle-btn {
            border-color: #dee2e6;
            background-color: #fff;
            color: #6c757d;
        }
        .password-toggle-btn:hover {
            background-color: #f8f9fa;
            color: #212529;
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center mb-4">Đăng ký thành viên</h3>

            <div th:if="${failMessage}" class="alert alert-danger text-center">
                <span th:text="${failMessage}"></span>
            </div>

            <div th:if="${successMessage}" class="alert alert-success text-center">
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${customer}" method="post">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger text-center">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Họ và tên:</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu:</label>
                    <div class="input-group">
                        <input type="password" id="registerPassword" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" required>
                        <button class="btn password-toggle-btn" type="button" id="togglePasswordBtn" title="Hiện/Ẩn mật khẩu">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số điện thoại (Mobile):</label>
                    <input type="text" th:field="*{phone}" class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giới tính:</label>
                    <select th:field="*{gender}" class="form-select"
                            th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Địa chỉ:</label>
                    <input type="text" th:field="*{address}" class="form-control"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mã bưu điện (Pin code):</label>
                    <input type="text" th:field="*{pinCode}" class="form-control"
                           th:classappend="${#fields.hasErrors('pinCode')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('pinCode')}" th:errors="*{pinCode}"></div>
                </div>

                <button type="submit" class="btn btn-success w-100">Đăng ký ngay</button>
                <br><br>
                <p>Đã có tài khoản? <a href="/login">Đăng nhập tại đây</a></p>
                <div class="text-center mt-3">
                    <a href="/" class="btn btn-outline-secondary btn-sm">🏠 Về trang chủ</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const passwordInput = document.getElementById("registerPassword");
        const passwordIcon = document.getElementById("togglePasswordIcon");

        if (toggleBtn && passwordInput && passwordIcon) {
            toggleBtn.addEventListener("click", function () {
                const isPassword = passwordInput.getAttribute("type") === "password";
                passwordInput.setAttribute("type", isPassword ? "text" : "password");

                if (isPassword) {
                    passwordIcon.classList.remove("fa-eye");
                    passwordIcon.classList.add("fa-eye-slash");
                } else {
                    passwordIcon.classList.remove("fa-eye-slash");
                    passwordIcon.classList.add("fa-eye");
                }
            });
        }
    });
</script>

</body>
</html>
