<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/admin-header :: header('products')}"></div>

<div class="container mb-5" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0" th:text="${product.id == null} ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'">Thêm sản phẩm mới</h3>
        <a href="/admin/products" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Quay lại danh sách
        </a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

	    <form th:action="${product.id == null} ? @{/admin/products/add} : @{/admin/products/update}"
	          method="post" 
	          th:object="${product}" 
	          enctype="multipart/form-data">
	        
	        <input type="hidden" th:field="*{id}">
	        <div class="mb-3">
	            <label class="form-label">Tên sản phẩm</label>
	            <input type="text" th:field="*{name}" class="form-control" required maxlength="255">
	        </div>

			<div class="mb-3">
			    <label class="form-label">Giá bán thường (VNĐ)</label>
			    <input type="number" th:field="*{price}" step="1" min="0" class="form-control" required>
			</div>

			<div class="mb-3">
			    <label class="form-label">Giá niêm yết (VNĐ)</label>
			    <input type="number" th:field="*{mrpPrice}" step="1" min="0" class="form-control">
			</div>

	        <div class="mb-3">
	            <label>Danh mục:</label>
			    <select th:field="*{productCategory}" class="form-select" required>
			        <option value="">Chọn danh mục</option>
	                <option value="Mobile">Điện thoại</option>
	                <option value="Laptop">Laptop</option>
	                <option value="Accessories">Phụ kiện</option>
	            </select>
	        </div>
			<div class="mb-3">
			    <label class="form-label">Số lượng tồn kho</label>
			    <input type="number" th:field="*{stock}" class="form-control" required min="0">
			</div>
			<div class="card p-3 mb-3 bg-light border-warning">
			                <h5 class="text-warning fw-bold">🔥 Cấu hình Flash Sale</h5>
			                <small class="text-muted mb-2 d-block">Để trống hoặc điền 0 nếu không giảm giá.</small>
			                
			                <div class="row">
								<div class="col-md-4 mb-2">
								    <label>Giá sale (VNĐ)</label>
								    <input type="number" th:field="*{discountPrice}" step="1" min="0" class="form-control">
								</div>
			                    <div class="col-md-4 mb-2">
			                        <label>Tổng suất Sale:</label>
			                        <input type="number" th:field="*{discountLimit}" class="form-control" value="0">
			                    </div>
			                    <div class="col-md-4 mb-2">
			                        <label>Đã bán (Readonly):</label>
				                        <input type="number" th:field="*{discountSold}" class="form-control" readonly>
			                    </div>
			                </div>
			            </div>
			<div class="mb-3">
			    <label>Mô tả sản phẩm:</label>
			    <textarea name="description" class="form-control" rows="10" th:field="*{description}"></textarea>
			</div>
	        
			<div class="mb-3">
			    <label>Ảnh sản phẩm (Chọn nhiều ảnh, ảnh đầu tiên sẽ là ảnh chính):</label><br>
			    
			    <div th:if="${product.image != null}" class="mb-2">
			        <p class="small text-muted">Ảnh chính hiện tại:</p>
			        <img style="height: 100px; border: 1px dashed #ccc; padding: 5px;" 
			             th:src="${product.image.startsWith('http') ? product.image : '/product-images/' + product.image}">
			    </div>
			    
			    <input type="file" name="imageFiles" class="form-control" accept="image/png,image/jpeg,image/webp" multiple>
			    <small class="text-secondary">Giữ phím Ctrl để chọn nhiều ảnh.</small>
			</div>
			

	        <button type="submit" class="btn btn-primary">Lưu lại</button>
	        <a href="/admin/products" class="btn btn-secondary">Hủy</a>
	    </form>
	</div>
</body>

</html>
