spring.application.name=da
server.port=8081

# Session Cookie Security (OWASP Standard)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techgear_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning (ECC JPA Patterns Standard)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Mail Configuration (Environment variables with safe defaults)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Gemini AI Configuration
spring.ai.google.api-key=${GEMINI_API_KEY:}
spring.ai.google.chat.options.model=gemini-1.5-flash

# LangChain4j (Gemini)
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY:}
langchain4j.google-ai-gemini.chat-model.timeout=30s
langchain4j.google-ai-gemini.chat-model.model-name=gemini-1.5-flash
langchain4j.google-ai-gemini.embedding-model.api-key=${GEMINI_API_KEY:}
langchain4j.google-ai-gemini.embedding-model.model-name=text-embedding-004

# Vector DB
vector.db.host=${VECTOR_DB_HOST:localhost}
vector.db.port=${VECTOR_DB_PORT:5433}
vector.db.name=${VECTOR_DB_NAME:chatbot_rag}
vector.db.user=${VECTOR_DB_USER:postgres}
vector.db.password=${VECTOR_DB_PASSWORD:postgres}

# Multipart Config
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Payment & Webhook Configuration
payment.vietqr.bank-id=${BANK_ID:STB}
payment.vietqr.account-no=${BANK_ACCOUNT_NO:050130869472}
payment.vietqr.account-name=${BANK_ACCOUNT_NAME:HA VAN DU}
payment.webhook.secret=${WEBHOOK_SECRET:dev_secret_key_change_me_in_prod}
