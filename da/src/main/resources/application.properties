spring.application.name=da
server.port=8081

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Mail Configuration (Environment variables with safe defaults)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Gemini AI Configuration
spring.ai.google.api-key=${GEMINI_API_KEY:}
spring.ai.google.chat.options.model=gemini-1.5-flash

# LangChain4j (Gemini)
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY:}
langchain4j.google-ai-gemini.chat-model.timeout=30s
langchain4j.google-ai-gemini.chat-model.model-name=gemini-1.5-flash
langchain4j.google-ai-gemini.embedding-model.api-key=${GEMINI_API_KEY:}
langchain4j.google-ai-gemini.embedding-model.model-name=text-embedding-004

# Vector DB
vector.db.host=${VECTOR_DB_HOST}
vector.db.port=${VECTOR_DB_PORT}
vector.db.name=${VECTOR_DB_NAME}
vector.db.user=${VECTOR_DB_USER}
vector.db.password=${VECTOR_DB_PASSWORD}

# Multipart Config
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Payment & Webhook Configuration
payment.vietqr.bank-id=${BANK_ID:STB}
payment.vietqr.account-no=${BANK_ACCOUNT_NO:050130869472}
payment.vietqr.account-name=${BANK_ACCOUNT_NAME:HA VAN DU}
payment.webhook.secret=${WEBHOOK_SECRET}
