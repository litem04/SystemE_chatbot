# Test Database Configuration (H2 In-Memory PostgreSQL Compatibility)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for Test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests to let Hibernate generate tables
spring.flyway.enabled=false


# Mail Configuration Test
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# AI API Keys Test Mock
spring.ai.google.api-key=test_api_key
langchain4j.google-ai-gemini.chat-model.api-key=test_api_key

# Webhook Secret Test
payment.webhook.secret=dev_webhook_secret_key_change_in_prod
app.embedding.in-memory=true
