<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đặt hàng thành công - TechGear</title>
    <div th:replace="~{layout/header :: header_head}"></div>
    <style>
        .success-card {
            max-width: 600px;
            margin: 60px auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .success-icon {
            font-size: 72px;
            color: #10b981;
        }
    </style>
</head>

<body class="bg-light d-flex flex-column justify-content-between min-vh-100">
    <div th:replace="~{layout/header :: header_nav}"></div>

    <div class="container my-auto">
        <div class="card success-card p-5 text-center bg-white border">
            <div class="mb-4">
                <i class="fas fa-circle-check success-icon"></i>
            </div>
            <h2 class="text-success fw-bold">Đặt hàng thành công!</h2>
            <p class="lead text-muted fs-6">Cảm ơn bạn đã tin tưởng mua sắm tại TechGear Store.</p>
            <p class="text-secondary small">Đơn hàng của bạn đã được tiếp nhận và nhân viên sẽ liên hệ đóng gói, giao
                hàng trong thời gian sớm nhất.</p>
            <div class="mt-4 d-flex justify-content-center gap-2 flex-wrap">
                <a href="/my-orders" class="btn btn-outline-danger px-4"><i class="fas fa-boxes-packing me-1"></i> Xem
                    đơn hàng của tôi</a>
                <a href="/" class="btn btn-danger px-4"><i class="fas fa-store me-1"></i> Tiếp tục mua sắm</a>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer_fragment}"></div>
</body>

</html>
