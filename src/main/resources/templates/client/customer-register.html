<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - TechGear Store</title>
    <div th:replace="~{layout/header :: header_head}"></div>
    <style>
        .register-card {
            max-width: 580px;
            margin: 40px auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            background: #ffffff;
            padding: 36px;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 0.35rem;
        }
        .password-toggle-btn {
            border-color: #dee2e8;
            background-color: #fff;
            color: #64748b;
        }
        .password-toggle-btn:hover {
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{layout/header :: header_nav}"></div>

<div class="container my-5">
    <div class="register-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-danger-subtle text-danger mb-2">
                <i class="fas fa-user-plus fa-2x"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Tạo Tài Khoản TechGear</h4>
            <p class="text-muted small">Đăng ký để nhận ưu đãi thành viên và bảo hành điện tử chính hãng</p>
        </div>

        <div th:if="${failMessage}" class="alert alert-danger text-center py-2 small">
            <span th:text="${failMessage}"></span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success text-center py-2 small">
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${customer}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger text-center py-2 small">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
            </div>

            <div class="mb-3">
                <label class="form-label">Họ và tên:</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Nguyễn Văn A"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Địa chỉ Email:</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="example@email.com"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu:</label>
                <div class="input-group">
                    <input type="password" id="registerPassword" th:field="*{password}" class="form-control"
                           placeholder="Tối thiểu 6 ký tự"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" required>
                    <button class="btn btn-outline-secondary password-toggle-btn" type="button" id="togglePasswordBtn">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-7">
                    <label class="form-label">Số điện thoại:</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="0901234567"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Giới tính:</label>
                    <select th:field="*{gender}" class="form-select"
                            th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Địa chỉ nhận hàng:</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, tên đường, phường/xã, quận/huyện"
                       th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Mã bưu điện (Zip/Pin Code):</label>
                <input type="text" th:field="*{pinCode}" class="form-control" placeholder="100000"
                       th:classappend="${#fields.hasErrors('pinCode')} ? 'is-invalid' : ''" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('pinCode')}" th:errors="*{pinCode}"></div>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold" style="border-radius: 8px;">
                Hoàn Tất Đăng Ký
            </button>
            
            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Đã có tài khoản? <a href="/login" class="text-danger fw-bold text-decoration-none">Đăng nhập tại đây</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{layout/footer :: footer_fragment}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const passwordInput = document.getElementById("registerPassword");
        const passwordIcon = document.getElementById("togglePasswordIcon");

        if (toggleBtn && passwordInput && passwordIcon) {
            toggleBtn.addEventListener("click", function () {
                const isPassword = passwordInput.getAttribute("type") === "password";
                passwordInput.setAttribute("type", isPassword ? "text" : "password");

                if (isPassword) {
                    passwordIcon.classList.remove("fa-eye");
                    passwordIcon.classList.add("fa-eye-slash");
                } else {
                    passwordIcon.classList.remove("fa-eye-slash");
                    passwordIcon.classList.add("fa-eye");
                }
            });
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
