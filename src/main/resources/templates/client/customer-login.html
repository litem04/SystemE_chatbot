<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập tài khoản - TechGear Store</title>
    <div th:replace="~{layout/header :: header_head}"></div>
    <style>
        .auth-card {
            max-width: 440px;
            margin: 50px auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            background: #ffffff;
            padding: 32px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-logo {
            width: 48px;
            height: 48px;
            background: #fee2e2;
            color: var(--tg-primary, #d70018);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{layout/header :: header_nav}"></div>

<div class="container my-5">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-lock"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Đăng Nhập</h4>
            <p class="text-muted small">Chào mừng bạn trở lại với TechGear Store</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
        <div th:if="${session['success-message']}" class="alert alert-success py-2 small">
            <span th:text="${session['success-message']}"></span>
            <th:block th:text="${#session.removeAttribute('success-message')}"></th:block>
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            <i class="fas fa-circle-exclamation me-1"></i> Sai email hoặc mật khẩu! Vui lòng thử lại.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small">
            <i class="fas fa-circle-check me-1"></i> Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>
        <div th:if="${failMessage}" class="alert alert-danger py-2 small" th:text="${failMessage}"></div>

        <form th:action="@{/do-login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Email tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="username" class="form-control border-start-0 ps-0" placeholder="example@email.com" required autocomplete="email">
                </div>
            </div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-semibold small text-secondary mb-0">Mật khẩu</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-key"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold" style="border-radius: 8px;">
                Đăng Nhập
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
            Chưa có tài khoản TechGear? 
            <a href="/register" class="text-danger fw-bold text-decoration-none">Đăng ký ngay</a>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer_fragment}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
