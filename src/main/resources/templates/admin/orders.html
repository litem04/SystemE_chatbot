<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/admin-header :: header('orders')}"></div>

<div class="container-fluid px-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="fw-bold mb-1"><i class="fas fa-shopping-cart text-primary me-2"></i>Quản lý đơn hàng</h3>
            <span class="text-muted small">Theo dõi đơn hàng, trạng thái thanh toán và quy trình giao vận</span>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Khách hàng</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Phương thức</th> <th>Thanh toán</th>  <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td>
                <b th:text="${o.customerName}"></b><br>
                <small th:text="${o.mobileNumber}"></small>
            </td>
            <td th:text="${o.orderDate}"></td>
			<td class="text-danger fw-bold" 
			    th:text="${o.productTotalPrice != null ? #numbers.formatDecimal(o.productTotalPrice, 0, 'POINT', 0, 'COMMA') + ' đ' : '0 đ'}">
			</td>
            <td>
                <span th:if="${o.paymentModeName == 'VIETQR'}" class="badge bg-info text-dark">VietQR</span>
                <span th:if="${o.paymentModeName == 'MOMO'}" class="badge bg-danger">Momo</span>
                <span th:if="${o.paymentModeName == 'COD' or o.paymentModeName == ''}" class="badge bg-secondary">COD</span>
            </td>
            <td>
                <span th:if="${o.isPaid() or o.paymentStatusName == 'PAID'}" class="badge bg-success">Đã trả tiền</span>
                <span th:if="${!o.isPaid() and o.paymentStatusName != 'PAID'}" class="badge bg-danger">Chưa trả tiền</span>
            </td>
            <td>
                <span th:if="${o.orderStatusName == 'WAITING_FOR_PAYMENT'}" class="badge bg-dark">Chờ thanh toán</span>
                <span th:if="${o.orderStatusName == 'PENDING'}" class="badge bg-warning text-dark">Chờ xử lý</span>
                <span th:if="${o.orderStatusName == 'PROCESSING'}" class="badge bg-info text-dark">Đang xử lý</span>
                <span th:if="${o.orderStatusName == 'SHIPPED'}" class="badge bg-info text-dark">Đang giao</span>
                <span th:if="${o.orderStatusName == 'DELIVERED'}" class="badge bg-success">Đã giao</span>
                <span th:if="${o.orderStatusName == 'CANCELLED'}" class="badge bg-danger">Đã hủy</span>
            </td>
            <td>
                <a th:href="@{/admin/orders/view/{id}(id=${o.id})}" class="btn btn-primary btn-sm">Xem chi tiết</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
